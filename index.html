<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adhiparasakthi Engineering College - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f4f6f9;
    }

    .login-card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 16px;
    }

    .college-logo {
      width: 120px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .login-card h2 {
      margin-bottom: 24px;
      color: #990000;
      font-size: 22px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #4a5568;
      font-size: 13px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #990000;
      box-shadow: 0 0 0 3px rgba(153, 0, 0, 0.15);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 13px;
      color: #4a5568;
    }

    .form-actions a {
      color: #990000;
      text-decoration: none;
      font-weight: 500;
    }

    .form-actions a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #990000;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #770000;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-container">
      <!-- Replace 'apec logo.png' with your image file path or URL -->
      <img src="apec logo.jpg" alt="Adhiparasakthi Engineering College Logo" class="college-logo">
    </div>

    <h2>Sign In</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username / Register No.</label>
        <input type="text" id="username" required placeholder="Enter your ID or Email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <div class="form-actions">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>
  </div>

</body>
</html>
